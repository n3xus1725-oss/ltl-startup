<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexus Freight - Production Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; }
    .table-container { max-height: 80vh; overflow-y: auto; }
    th { position: sticky; top: 0; background: #121212; z-index: 10; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="border-b border-[#262626] bg-[#0a0a0a] p-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-white">N</div>
      <h1 class="text-lg font-semibold tracking-wide">Nexus Freight Platform</h1>
    </div>
    <div class="flex items-center space-x-4">
      <button onclick="syncLiveInbox()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-sm font-medium transition">
        Sync Live Inbox
      </button>
      <div class="h-6 w-px bg-[#333]"></div>
      <span class="text-sm text-neutral-400">Status: <span class="text-green-400">Live</span></span>
    </div>
  </header>

  <main class="flex-1 p-6 flex space-x-6">
    <div class="w-2/3 flex flex-col">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold">Live Shipments Database</h2>
        <button onclick="refreshShipments()" class="text-sm text-neutral-400 hover:text-white transition">Refresh</button>
      </div>
      <div class="table-container border border-[#262626] rounded-lg bg-[#0f0f0f]">
        <table class="w-full text-left text-sm whitespace-nowrap">
          <thead>
            <tr class="border-b border-[#262626] text-neutral-400 uppercase text-[10px] tracking-wider">
              <th class="px-4 py-3 font-semibold">Shipment #</th>
              <th class="px-4 py-3 font-semibold">Carrier</th>
              <th class="px-4 py-3 font-semibold">Status</th>
              <th class="px-4 py-3 font-semibold">Origin</th>
              <th class="px-4 py-3 font-semibold">Destination</th>
              <th class="px-4 py-3 font-semibold">ETA</th>
              <th class="px-4 py-3 font-semibold">Total Billed</th>
              <th class="px-4 py-3 font-semibold">Last Updated</th>
            </tr>
          </thead>
          <tbody id="shipments-tbody" class="divide-y divide-[#262626]">
            <tr><td colspan="8" class="p-4 text-center text-neutral-500">Loading shipments...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    
    <div class="w-1/3 flex flex-col">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold">Recent Event Log</h2>
        <button onclick="refreshAuditLogs()" class="text-sm text-neutral-400 hover:text-white transition">Refresh</button>
      </div>
      <div class="table-container border border-[#262626] rounded-lg bg-[#0f0f0f] p-2 space-y-2" id="audit-log-container">
        <div class="p-4 text-center text-neutral-500 text-sm">Loading logs...</div>
      </div>
    </div>
  </main>

  <script>
    async function syncLiveInbox() {
      const btn = document.querySelector('button[onclick="syncLiveInbox()"]');
      const originalText = btn.innerText;
      btn.innerText = 'Syncing...';
      btn.disabled = true;
      try {
        const res = await fetch('/api/v1/connectors/gmail/sync', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ organization_id: null, limit: 10, mock_mode: false })
        });
        const data = await res.json();
        alert(`Sync complete! Processed ${data.messages_processed || 0} messages.`);
        refreshShipments();
        refreshAuditLogs();
      } catch (err) {
        alert("Error syncing inbox: " + err);
      } finally {
        btn.innerText = originalText;
        btn.disabled = false;
      }
    }

    async function refreshShipments() {
      try {
        const res = await fetch('/api/v1/test-ui/shipments');
        const data = await res.json();
        const tbody = document.getElementById('shipments-tbody');
        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="p-4 text-center text-neutral-500">No shipments found.</td></tr>';
          return;
        }
        tbody.innerHTML = data.map(s => `
          <tr class="hover:bg-[#1a1a1a] transition">
            <td class="px-4 py-3 font-mono text-white">${s.shipment_number || 'PENDING'}</td>
            <td class="px-4 py-3 text-neutral-300">${s.carrier_name || '-'}</td>
            <td class="px-4 py-3"><span class="px-2 py-1 rounded text-[10px] uppercase font-semibold bg-neutral-800 text-neutral-300">${s.status || 'unknown'}</span></td>
            <td class="px-4 py-3 text-neutral-300">${s.origin ? s.origin.city + ', ' + s.origin.state : '-'}</td>
            <td class="px-4 py-3 text-neutral-300">${s.destination ? s.destination.city + ', ' + s.destination.state : '-'}</td>
            <td class="px-4 py-3 text-neutral-300">${s.eta ? new Date(s.eta).toLocaleDateString() : '-'}</td>
            <td class="px-4 py-3 text-green-400 font-mono">${s.total_amount_billed ? '$' + s.total_amount_billed.toFixed(2) : '-'}</td>
            <td class="px-4 py-3 text-neutral-500 text-xs">${s.updated_at ? new Date(s.updated_at).toLocaleString() : '-'}</td>
          </tr>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function refreshAuditLogs() {
      try {
        const res = await fetch('/api/v1/test-ui/audit-logs?limit=20');
        const data = await res.json();
        const container = document.getElementById('audit-log-container');
        if (!data || data.length === 0) {
          container.innerHTML = '<div class="p-4 text-center text-neutral-500 text-sm">No audit logs found.</div>';
          return;
        }
        container.innerHTML = data.map(log => `
          <div class="p-3 bg-[#141414] rounded border border-[#262626] flex flex-col space-y-1">
            <div class="flex justify-between items-center">
              <span class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">${log.action_taken}</span>
              <span class="text-[10px] text-neutral-500">${new Date(log.timestamp).toLocaleTimeString()}</span>
            </div>
            <div class="text-xs text-neutral-300 font-mono break-all">${log.event_type}</div>
            <div class="text-[10px] text-neutral-500">Actor: ${log.actor_type} (${log.actor_id})</div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    // Initial load
    refreshShipments();
    refreshAuditLogs();
    setInterval(refreshShipments, 15000);
    setInterval(refreshAuditLogs, 15000);
  </script>
</body>
</html>
