name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Runtime environment — use SQLite in-memory for CI (no Supabase needed)
      ENVIRONMENT: test
      DATABASE_URL: "sqlite:///./ci_test.db"
      MOCK_EMAIL_CONNECTOR: "true"
      # Prevent LiteLLM / LangGraph from making real API calls
      OPENAI_API_KEY: "sk-test-ci-placeholder"
      ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
      LITELLM_MODEL: "gpt-4o-mini"
      # Prevent psycopg2/psycopg from trying to connect to real Postgres
      SUPABASE_URL: "http://localhost:54321"
      SUPABASE_ANON_KEY: "ci-placeholder-key"
      SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-key"
      # Email connector mock
      IMAP_HOST: "localhost"
      IMAP_USER: "test@test.com"
      IMAP_PASSWORD: "test"
      SMTP_HOST: "localhost"
      SMTP_USER: "test@test.com"
      SMTP_PASSWORD: "test"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        run: |
          pytest -v --tb=short -x
