[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freight-platform"
version = "0.1.0"
description = "AI Freight Information & Execution Platform"
readme = "implementation.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg[binary]>=3.1.18",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "langgraph>=1.2.0",
    "litellm>=1.40.0",
    "python-dateutil>=2.9.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "apps/agent/inbox/tests", "apps/agent/audit/tests", "apps/agent/dispute/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = [
    ".",
    "apps",
    "packages"
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "repos",
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]

[tool.vercel]
entrypoint = "main:app"
